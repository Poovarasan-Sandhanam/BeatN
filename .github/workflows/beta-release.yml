# Builds BeatN in EAS's cloud and submits it for testing — the same thing
# `npm run beta:ios` / `npm run beta:android` do, started from GitHub instead
# of a laptop. Manual only: every run costs an EAS build and a build number.
#
# Setup (once): add an Expo access token as the repository secret EXPO_TOKEN
# (expo.dev → Account settings → Access tokens → Create).
#
# iOS uploads to TestFlight with the App Store credentials already stored on
# EAS. Android uploads to Play's internal track only once a Google service
# account key has been added to EAS (`npx eas-cli credentials`); until then
# the Android build still succeeds and only its submission fails, on EAS.
name: Beta release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which app to build
        type: choice
        options: [ios, android, all]
        default: ios
      track:
        description: 'Android only: internal testing, or the closed test that counts toward Play''s 14-day requirement'
        type: choice
        options: [internal, closed]
        default: internal

# One release at a time; a second click waits instead of racing the first.
concurrency:
  group: beta-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    # Never ship what CI would reject.
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RNLLAMA_SKIP_POSTINSTALL: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20.19'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci

  release:
    name: Build and submit (${{ inputs.platform }})
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # EAS installs its own copy of every dependency in the cloud; the native
      # binaries are never needed on this runner.
      RNLLAMA_SKIP_POSTINSTALL: '1'
    steps:
      - name: Require the Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add an Expo access token as the repository secret EXPO_TOKEN (expo.dev → Account settings → Access tokens)."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20.19'
          cache: npm

      # EAS reads app.json and its config plugins locally before uploading,
      # so the project's dependencies must be installed.
      - run: npm ci

      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build and submit iOS → TestFlight
        if: inputs.platform == 'ios' || inputs.platform == 'all'
        run: eas build --platform ios --profile beta --auto-submit-with-profile beta --non-interactive --no-wait

      - name: Build and submit Android → Play ${{ inputs.track }} track
        if: inputs.platform == 'android' || inputs.platform == 'all'
        run: |
          submit_profile=beta
          if [ "${{ inputs.track }}" = "closed" ]; then submit_profile=closed; fi
          eas build --platform android --profile beta --auto-submit-with-profile "$submit_profile" --non-interactive --no-wait

      - name: Where to follow it
        run: |
          echo "### Build started on EAS" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "This job only starts the build. Follow it — and the submission that runs after it — at https://expo.dev under the BeatN project. iOS appears in TestFlight about 30–60 minutes after it starts." >> "$GITHUB_STEP_SUMMARY"
